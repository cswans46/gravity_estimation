
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cai-2023"
version = "0.1.0"
description = "Replication of Cai et al. (2023)"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "xarray",
    "pyreadr",
    "xlrd",       # reading CEPII dist_cepii.xls
    "openpyxl",
    "joblib",
    "matplotlib",
]

[tool.setuptools]
packages = ["gravity_irio"]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "ruff",
    "ipykernel",
]

[tool.black]
line-length = 120
target-version = ["py310"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
