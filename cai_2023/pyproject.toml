[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cai-icio-gravity"
version = "0.2.0"
description = "Industry-level gravity estimation using OECD ICIO data"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "xarray>=2023.1",
    "pyreadr>=0.5",
    "pyreadstat>=1.2",
    "scipy>=1.10",
    "statsmodels>=0.14",
    "pyfixest>=0.70",
    "pyarrow>=14",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "PyYAML>=6.0",
    "tqdm>=4.65",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "black>=23.0", "ruff>=0.3", "ipykernel"]

[tool.setuptools.packages.find]
where = ["."]
include = ["gravity_icio*"]

[tool.black]
line-length = 120
target-version = ["py311"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
